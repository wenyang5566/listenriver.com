{{- define "main" }}
<article class="about-page about-page-light">
  <section class="about-hero">
    <div class="about-river" aria-hidden="true">{{ partial "river-opening-art.html" . }}</div>
    <div class="about-avatar-wrap">
      <img class="about-avatar" src="{{ hugo.Data.author.portrait | relURL }}" alt="文揚的肖像" width="236" height="236">
    </div>
    <div class="about-hero-copy">
      <div class="about-hero-head">
        <p class="about-kicker">{{ .Site.Title }}</p>
        <h1 class="about-title">{{ hugo.Data.author.name }}</h1>
      </div>
      <p class="about-subtitle about-subtitle--opening">{{ hugo.Data.author.introduction }}</p>
      <p class="about-subtitle">{{ hugo.Data.author.credentials }}</p>
    </div>
  </section>

  <section class="about-grid about-grid-single">
    <section class="about-card about-card-wide about-card-soft">
      <h2 class="about-section-title">網站介紹</h2>
      <div class="about-content">
        {{ .Content }}
      </div>
    </section>
  </section>
</article>
{{- end }}
