<nav class="mobile-reading-toolbar" data-mobile-reading-toolbar aria-label="手機文章閱讀工具列">
  <button class="mobile-reading-toolbar__item" type="button" data-mobile-reading-back data-fallback-url="{{ "/" | relLangURL }}" aria-label="上一頁">
    <span class="mobile-reading-toolbar__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
    </span>
    <span class="mobile-reading-toolbar__label">上一頁</span>
  </button>

  <button class="mobile-reading-toolbar__item" type="button" data-mobile-reading-size aria-label="調整文章字級，目前為標準">
    <span class="mobile-reading-toolbar__icon mobile-reading-toolbar__icon--text" aria-hidden="true">Aa</span>
    <span class="mobile-reading-toolbar__label">字級</span>
  </button>

  <button class="mobile-reading-toolbar__item" type="button" data-mobile-reading-related aria-label="跳到更多文章">
    <span class="mobile-reading-toolbar__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 5.5h10a4 4 0 0 1 4 4v9H9a4 4 0 0 1-4-4v-9Z"></path>
        <path d="M9 9h6"></path>
        <path d="M9 13h4"></path>
      </svg>
    </span>
    <span class="mobile-reading-toolbar__label">更多文章</span>
  </button>

  <button class="mobile-reading-toolbar__item" type="button" data-mobile-reading-share aria-label="分享目前頁面">
    <span class="mobile-reading-toolbar__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path>
        <path d="M12 16V4"></path>
        <path d="M7.5 8.5 12 4l4.5 4.5"></path>
      </svg>
    </span>
    <span class="mobile-reading-toolbar__label">分享</span>
  </button>

  <span class="mobile-reading-toolbar__toast" data-mobile-reading-toast role="status" aria-live="polite">已複製連結</span>
</nav>

<script>
  (function () {
    const toolbar = document.querySelector('[data-mobile-reading-toolbar]');
    if (!toolbar) return;

    const backButton = toolbar.querySelector('[data-mobile-reading-back]');
    const sizeButton = toolbar.querySelector('[data-mobile-reading-size]');
    const relatedButton = toolbar.querySelector('[data-mobile-reading-related]');
    const shareButton = toolbar.querySelector('[data-mobile-reading-share]');
    const toast = toolbar.querySelector('[data-mobile-reading-toast]');
    const readingSizeKey = 'listenriver-reading-size';
    const readingSizes = ['normal', 'large', 'small'];
    const readingSizeLabels = { small: '小', normal: '標準', large: '大' };

    function getSavedReadingSize() {
      try {
        const saved = window.localStorage.getItem(readingSizeKey);
        return ['small', 'normal', 'large'].includes(saved) ? saved : 'normal';
      } catch (error) {
        return 'normal';
      }
    }

    function applyReadingSize(size, persist) {
      document.documentElement.dataset.readingSize = size;
      if (sizeButton) {
        sizeButton.setAttribute('aria-label', '調整文章字級，目前為' + readingSizeLabels[size]);
        sizeButton.setAttribute('data-reading-size-current', size);
      }
      if (persist) {
        try {
          window.localStorage.setItem(readingSizeKey, size);
        } catch (error) {}
      }
    }

    function showToolbar() {
      document.dispatchEvent(new Event('navigation:reveal'));
    }

    if (backButton) {
      backButton.addEventListener('click', function () {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = backButton.getAttribute('data-fallback-url') || '/';
      });
    }

    if (sizeButton) {
      applyReadingSize(getSavedReadingSize(), false);
      sizeButton.addEventListener('click', function () {
        showToolbar();
        const current = document.documentElement.dataset.readingSize || 'normal';
        const next = readingSizes[(readingSizes.indexOf(current) + 1) % readingSizes.length];
        applyReadingSize(next, true);
        showToast('字級：' + readingSizeLabels[next]);
      });
    }

    if (relatedButton) {
      const relatedTarget = document.getElementById('related-posts');
      if (!relatedTarget) {
        relatedButton.classList.add('is-disabled');
        relatedButton.disabled = true;
        relatedButton.setAttribute('aria-disabled', 'true');
      } else {
        relatedButton.addEventListener('click', function () {
          showToolbar();
          relatedTarget.scrollIntoView({
            behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
            block: 'start'
          });
          if (window.history && window.history.pushState) {
            window.history.pushState(null, '', '#related-posts');
          }
        });
      }
    }

    function showToast(message) {
      if (!toast) return;
      showToolbar();
      toast.textContent = message || '已複製連結';
      toast.classList.add('is-visible');
      window.setTimeout(function () {
        toast.classList.remove('is-visible');
      }, 1600);
    }

    function copyUrl() {
      const url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(url).then(function () { showToast('已複製連結'); });
      }
      const input = document.createElement('input');
      input.value = url;
      input.setAttribute('readonly', '');
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      try {
        document.execCommand('copy');
        showToast('已複製連結');
      } finally {
        document.body.removeChild(input);
      }
      return Promise.resolve();
    }

    if (shareButton) {
      shareButton.addEventListener('click', function () {
        const shareData = {
          title: document.title,
          url: window.location.href
        };
        if (navigator.share) {
          navigator.share(shareData).catch(function () {});
          return;
        }
        copyUrl();
      });
    }

    showToolbar();
  })();
</script>
