lead:
  page: /blog/開放式對話/肯認每一種聲音的存在/
  label: 在關係裡，練習聆聽
  title: 肯認每一種聲音的存在
  note: 參與開放式對話進階工作坊後，我重新思考傾聽與回應：如何從身體感覺、情緒與關係理解一個人？這篇記錄工作坊的練習與反思，探討對話如何讓難以表達的受苦經驗被說出、被見證，以及為什麼每一種聲音都值得被肯認。
