pain-and-listening:
  destination: /reading-paths/
  title: 病痛，如何被聽見？
  introduction: 從難以說清楚的自身經驗，到閱讀、對話與工作現場，沿著四篇書寫，慢慢靠近理解與陪伴。
  nodes:
    - page: /blog/病痛經驗/關於自我揭露/
      theme: 自身經驗
      question: 說出病痛經驗，為什麼這麼難？
      note: 從一次自我揭露的經驗，讀到病痛經驗與語言之間的距離。
      nextReason: 當自身的病痛經驗難以表達，再看看閱讀如何替這些感受找到語言。
    - page: /blog/閱讀心得/聆聽疼痛/
      theme: 閱讀與理解
      question: 閱讀能替病痛經驗找到語言嗎？
      note: 《聆聽疼痛》的閱讀心得，連起身體感受、語言與受苦經驗。
      nextReason: 從病痛裡難以說出的感受，走向如何容納另一個人的聲音。
    - page: /blog/開放式對話/肯認每一種聲音的存在/
      theme: 對話與聆聽
      question: 不同的聲音，能怎麼被容納？
      note: 在開放式對話的學習裡，重新思考傾聽、回應與共同的語言。
      nextReason: 把對話帶回日常工作，看看白板如何成為理解一個人經驗的媒介。
    - page: /clubhouse/工作日誌/07白板溝通/
      theme: 工作現場
      question: 理解能在一起做事時發生嗎？
      note: 從白板溝通的工作紀錄，讀到病痛經驗如何連回會員的主觀世界。
